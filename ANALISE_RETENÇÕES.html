<style type="text/tailwindcss">
@theme{
  --color-azul:#2584C6;--color-azul-esc:#1B6AA5;--color-amarelo:#F3C64F;--color-vermelho:#E02F36;
  --color-fundo:#F3F8FC;--color-chip:#DCEBF7;--color-linha:#CFDDEA;--color-suave:#55666A;
  --color-verde:#1E7A46;--color-ambar:#8A5A00;--color-alerta:#B3261E;
  --font-sans:Inter,Arial,sans-serif;--font-titulo:Montserrat,Arial,sans-serif;
}
</style>
<style>
:root{--azul:#2584C6;--azul-esc:#1B6AA5;--amarelo:#F3C64F;--vermelho:#E02F36;--turquesa:#3FC2D0;--fundo:#F3F8FC;--chip:#DCEBF7;--linha:#CFDDEA;--texto:#1B1F24;--suave:#55666A;--verde:#1E7A46;--ambar:#8A5A00;--alerta:#B3261E}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fundo);color:var(--texto);font:14px/1.5 Inter,Arial,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Montserrat,Arial,sans-serif;margin:0;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.ol-head{background:var(--azul);border-bottom:6px solid var(--amarelo);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px}
.ol-logo{background:#fff;border-radius:12px;padding:5px 10px;display:flex;flex:none}
.ol-logo img{height:48px;width:auto;display:block}
.ol-head h1{font-size:20px;font-weight:800;line-height:1.2}
.ol-head p{margin:2px 0 0;opacity:.88;font-size:12.5px}
.card{background:#fff;border:1px solid var(--linha);border-radius:12px;padding:16px 18px}
.kpi small{display:block;font-size:12px;color:var(--suave)}
.kpi b{display:block;font:700 22px Montserrat,Arial,sans-serif;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--suave)}
.kpi span b{display:inline;font:600 12px Inter,Arial;margin:0;color:var(--texto)}
table.ol{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--linha);font-variant-numeric:tabular-nums;font-size:13px}
table.ol th{background:var(--azul-esc);color:#fff;text-align:left;padding:8px 10px;font-weight:600;font-size:12px;white-space:nowrap;vertical-align:bottom}
table.ol td{padding:7px 10px;border-top:1px solid var(--linha);vertical-align:top}
table.ol tbody tr:nth-child(even) td{background:var(--fundo)}
table.ol .n{text-align:right}
table.ol tr.tot td{background:var(--chip)!important;font-weight:700}
table.ol th small{display:block;font-weight:400;opacity:.85;font-size:10.5px}
table.ol .stk{position:sticky;left:0;z-index:1;background:inherit}
table.ol tbody tr:nth-child(odd) td.stk{background:#fff}table.ol tbody tr:nth-child(even) td.stk{background:var(--fundo)}
table.ol th.stk{background:var(--azul-esc);z-index:2}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--chip);color:var(--azul-esc);white-space:nowrap}
.chip.ok{background:#DDF1E5;color:var(--verde)}.chip.at{background:#FCEFC7;color:var(--ambar)}.chip.cr{background:#FBE0DE;color:var(--alerta)}.chip.cz{background:#ECEFF1;color:#455A64}
.aviso{border-left:4px solid var(--azul);background:#fff;border-radius:6px;padding:10px 14px;border-top:1px solid var(--linha);border-right:1px solid var(--linha);border-bottom:1px solid var(--linha)}
.aviso.at{border-left-color:var(--amarelo)}.aviso.cr{border-left-color:var(--vermelho)}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 14px;font-weight:600;font-size:13px;border:1px solid var(--azul);background:var(--azul);color:#fff;cursor:pointer;min-height:36px}
.btn:hover{background:var(--azul-esc)}
.btn.sec{background:#fff;color:var(--azul-esc)}.btn.sec:hover{background:var(--chip)}
.btn.perigo{background:var(--alerta);border-color:var(--alerta)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 10px;min-height:28px;font-size:12px}
input,select,textarea{font:inherit;border:1px solid var(--linha);border-radius:8px;padding:6px 10px;background:#fff;min-height:36px;max-width:100%}
input[type=checkbox],input[type=radio]{min-height:0;width:18px;height:18px;accent-color:var(--azul-esc)}
label.lb{display:block;font-size:11.5px;color:var(--suave);margin-bottom:2px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;color:var(--texto);text-decoration:none;font-weight:600;cursor:pointer}
.nav a:hover{background:var(--chip)}
.nav a.on{background:var(--azul);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--linha);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:600;color:var(--suave);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;font:600 13px Inter,Arial}
.tabs button.on{color:var(--azul-esc);border-bottom-color:var(--azul)}
.badge{display:inline-block;min-width:20px;text-align:center;border-radius:99px;background:var(--alerta);color:#fff;font-size:11px;padding:0 6px;margin-left:6px}
dialog{margin:auto;border:1px solid var(--linha);border-radius:14px;padding:0;max-width:min(94vw,560px);width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog.largo{max-width:min(96vw,980px)}
dialog::backdrop{background:rgba(20,40,60,.45)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1B1F24;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:99;max-width:90vw}
.h2{font:700 16px Montserrat,Arial;color:var(--azul-esc);margin:22px 0 10px}
#rel-print{display:none}
@media(max-width:640px){.ol-head{padding:10px 12px}.ol-logo img{height:38px}.ol-head h1{font-size:16px}}
@media print{
  @page{size:A4 landscape;margin:10mm 10mm 14mm;@bottom-center{content:"Prefeitura da Estância Turística de Olímpia · Painel de Retenções · página " counter(page);font:9px Arial;color:#55666A}}
  body{background:#fff}
  #login,#app,dialog,#toast{display:none!important}
  #rel-print{display:block!important;font-size:8pt}
  #rel-print table{width:100%;border-collapse:collapse;font-size:7.5pt;font-variant-numeric:tabular-nums}
  #rel-print th{background:#1B6AA5!important;color:#fff;padding:3px 4px;text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #rel-print td{padding:2px 4px;border-top:.5pt solid #CFDDEA}
  #rel-print .n{text-align:right}#rel-print thead{display:table-header-group}#rel-print tfoot{display:table-row-group}
  #rel-print tr.tot td{background:#DCEBF7;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #rel-print .cab{background:#2584C6;border-bottom:4pt solid #F3C64F;color:#fff;padding:6pt 10pt;margin-bottom:6pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #rel-print .cab b{font:800 13pt Montserrat,Arial}
}
</style>
</head>

function modal({titulo,texto='',html='',resumo=null,campo=null,ok='Confirmar',cancelar='Cancelar',perigo=false}){
  return new Promise(res=>{
    const d=$('#dlg');let fechado=false;
    let campoHTML='';
    if(campo){
      if(campo.tipo==='radio')campoHTML=`<div class="mt-3"><div class="lb">${esc(campo.rotulo)}</div>${campo.opcoes.map((o,i)=>`<label class="flex gap-2 items-start py-1 cursor-pointer"><input type="radio" name="mc" value="${esc(o.v)}" ${o.v===campo.valor?'checked':''}><span><b>${esc(o.t)}</b><br><small class="text-suave">${esc(o.d||'')}</small></span></label>`).join('')}</div>`;
      else campoHTML=`<div class="mt-3"><label class="lb" for="mc">${esc(campo.rotulo)}</label>${campo.tipo==='textarea'?`<textarea id="mc" rows="3" class="w-full" placeholder="${esc(campo.dica||'')}">${esc(campo.valor||'')}</textarea>`:`<input id="mc" class="w-full" value="${esc(campo.valor||'')}">`}<div id="mc-err" class="text-xs mt-1" style="color:var(--alerta)"></div></div>`;
    }
    d.innerHTML=`<form method="dialog" class="p-5"><h2 style="font-size:17px;color:${perigo?'var(--alerta)':'var(--azul-esc)'}">${esc(titulo)}</h2>
      ${texto?`<p class="mt-2">${esc(texto)}</p>`:''}${html}
      ${resumo?`<div class="mt-3 rounded-lg p-3 text-[13px]" style="background:var(--fundo);border:1px solid var(--linha)">${resumo}</div>`:''}
      ${campoHTML}
      <div class="flex gap-2 justify-end mt-5 flex-wrap"><button type="button" class="btn sec" id="mc-no">${esc(cancelar)}</button><button type="button" class="btn ${perigo?'perigo':''}" id="mc-ok">${esc(ok)}</button></div></form>`;
    const fim=v=>{if(fechado)return;fechado=true;d.close();res(v)};
    const pegar=()=>{
      if(!campo)return true;
      if(campo.tipo==='radio')return d.querySelector('input[name=mc]:checked')?.value??null;
      const v=$('#mc').value.trim();
      if(campo.obrigatorio&&!v){$('#mc-err').textContent='Preencha este campo para continuar.';return undefined}
      return v;
    };
    $('#mc-ok').onclick=()=>{const v=pegar();if(v===undefined)return;fim(campo?v:true)};
    $('#mc-no').onclick=()=>fim(null);
    d.onclose=()=>fim(null);
    d.onclick=e=>{if(e.target===d)fim(null)};
    d.onkeydown=e=>{if(e.key==='Enter'&&campo?.tipo!=='textarea'){e.preventDefault();$('#mc-ok').click()}};
    d.showModal();
    if($('#mc'))$('#mc').oninput=()=>{const e=$('#mc-err');if(e)e.textContent=''};
    ($('#mc')||$('#mc-ok')).focus();
  });
}

let TOKEN=null,TOKEN_EXP=0,tokenClient=null,SESSAO=null,_resTok=null;
window.iniciarGoogle=function(){
  if(tokenClient||!window.google?.accounts?.oauth2)return;
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CONFIG.clientId,scope:CONFIG.escopos,
    callback:r=>{if(r&&r.access_token){TOKEN=r.access_token;TOKEN_EXP=Date.now()+(r.expires_in||3600)*1000;_resTok&&_resTok.ok()}else _resTok&&_resTok.erro({message:(r&&r.error_description)||(r&&r.error)||'Login não concluído.'})},
    error_callback:e=>_resTok&&_resTok.erro({message:e.type==='popup_closed'?'A janela de login foi fechada antes de concluir.':(e.message||e.type||'Falha no login.')})
  });

function pedirToken(prompt){return new Promise((ok,erro)=>{if(!tokenClient)return erro({message:'Serviço de login do Google não carregou. Verifique a conexão e recarregue.'});_resTok={ok,erro};tokenClient.requestAccessToken({prompt})})}
const BASE='https://sheets.googleapis.com/v4/spreadsheets/';
async function SHEETS(path,opts={},retry=true){
  if(!TOKEN||Date.now()>TOKEN_EXP-60000)await pedirToken('');
  const r=await fetch(BASE+CONFIG.planilhaId+path,{...opts,headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'}});
  if(r.status===401&&retry){TOKEN=null;await pedirToken('');return SHEETS(path,opts,false)}
  if(!r.ok){let j={};try{j=await r.json()}catch(e){}throw{status:r.status,message:(j.error&&j.error.message)||r.statusText}}
  return r.json();
}

/* ============ CALENDÁRIO: FERIADOS E DIAS ÚTEIS ============ */
const _FER=new Map();
function pascoa(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;return y+'-'+pad(mes)+'-'+pad(dia)}
function feriados(y){
  if(_FER.has(y))return _FER.get(y);
  const m=new Map(),f=(d,n)=>m.set(d,n),P=pascoa(y);
  [['01-01','Confraternização Universal'],['04-21','Tiradentes'],['05-01','Dia do Trabalho'],['07-09','Revolução Constitucionalista (SP)'],['09-07','Independência do Brasil'],['10-12','Nossa Senhora Aparecida'],['11-02','Finados'],['11-15','Proclamação da República'],['11-20','Consciência Negra'],['12-25','Natal']].forEach(([d,n])=>f(y+'-'+d,n));
  f(addDias(P,-48),'Carnaval (sem expediente bancário)');f(addDias(P,-47),'Carnaval (sem expediente bancário)');
  f(addDias(P,-2),'Sexta-feira Santa');f(addDias(P,60),'Corpus Christi (sem expediente bancário)');
  D.fer.filter(x=>x.data.startsWith(y+'-')).forEach(x=>f(x.data,x.nome));
  _FER.set(y,m);return m;
}
const motivoNaoUtil=i=>{const d=dow(i);const f=feriados(+i.slice(0,4)).get(i);return f?'feriado ('+f+')':d===0?'cai em domingo':d===6?'cai em sábado':''};
const ehUtil=i=>!motivoNaoUtil(i);
/* guia do INSS: dia 20 do mês seguinte à competência; se não útil, antecipa para o dia útil anterior */
function venc(comp){
  let y=+comp.slice(0,4),m=+comp.slice(5)+1;if(m>12){m=1;y++}
  const orig=y+'-'+pad(m)+'-20';let d=orig,motivo='';
  if(!ehUtil(d)){motivo='Dia 20 ('+fdata(orig).slice(0,5)+') '+motivoNaoUtil(orig);while(!ehUtil(d))d=addDias(d,-1)}
  return{iso:d,orig,motivo,antecipado:d!==orig};
}
function diasUteisMes(y,m){let n=0;const t=new Date(Date.UTC(y,m,0)).getUTCDate();for(let d=1;d<=t;d++)if(ehUtil(y+'-'+pad(m)+'-'+pad(d)))n++;return n}
function diasUteisAte(y,m,corte){let n=0;const t=new Date(Date.UTC(y,m,0)).getUTCDate();for(let d=1;d<=t;d++){const i=y+'-'+pad(m)+'-'+pad(d);if(i<=corte&&ehUtil(i))n++}return n}
function situacao(vi,hoje){
  const n=diffDias(vi,hoje);
  if(n<0)return{t:'Prazo encerrado',c:'cz',n};
  if(n===0)return{t:'Vence hoje',c:'cr',n};
  if(n<=5)return{t:'Vence em '+n+' dia'+(n>1?'s':''),c:'at',n};
  return{t:'A vencer · '+n+' dias',c:'',n};
}

function aplicarComp(r){

  if(b){r.ano=+b.slice(0,4);r.mes=+b.slice(5,7)}else{r.ano=r.anoS;r.mes=r.mesS}

const CRIT={liquidacao:'data da liquidação',emissao:'data de emissão do documento'};
const UI={criterio:(()=>{try{return localStorage.getItem('ret_criterio')==='emissao'?'emissao':'liquidacao'}catch(e){return'liquidacao'}})(),tela:null,aba:'mensal',exercicio:null,hoje:null,busca:'',selAl:new Set(),selJu:new Set()};
const hoje=()=>UI.hoje||hojeReal();

/* ============ CÁLCULOS ============ */
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const r2=n=>Math.round(n*100)/100;
function exercicios(){const s=new Set(D.rows.map(r=>r.ano).filter(Boolean));s.add(+hoje().slice(0,4));return[...s].sort((a,b)=>b-a)}
const rowsEx=()=>D.rows.filter(r=>r.ano===UI.exercicio);
function porComp(rows){
  const m=new Map();
  for(const r of rows){const g=m.get(r.comp)||{comp:r.comp,inss:0,base:0,n:0,forn:new Set()};g.inss+=r.inss;g.base+=r.base;g.n++;g.forn.add(r.cod);m.set(r.comp,g)}
  return[...m.values()].sort((a,b)=>a.comp.localeCompare(b.comp));
}
function porForn(rows){
  const m=new Map();
  for(const r of rows){
    let g=m.get(r.cod);if(!g){g={cod:r.cod,forn:r.forn,doc:r.doc,tipo:r.tipo,meses:{},base:{},n:{},total:0,baseT:0};m.set(r.cod,g)}
    const k=r.mes;g.meses[k]=(g.meses[k]||0)+r.inss;g.base[k]=(g.base[k]||0)+r.base;g.n[k]=(g.n[k]||0)+1;g.total+=r.inss;g.baseT+=r.base;g.forn=r.forn;
  }
  return[...m.values()];
}
function tipoAlerta(t){return{BASE_ZERADA:'Base de cálculo zerada',INSS_ZERADO:'INSS zerado com base informada',INSS_MAIOR_BASE:'INSS maior que a base'}[t]||t}
function calcAlertas(rows){
  const m=new Map();
  for(const r of rows){
    const t=[];
    if(r.base===0&&r.vdoc>0)t.push('BASE_ZERADA');else if(r.base>0&&r.inss===0)t.push('INSS_ZERADO');
    if(r.base>0&&r.inss>r.base+0.005)t.push('INSS_MAIOR_BASE');
    for(const tp of t){
      const k=r.cod+'|'+r.comp+'|'+tp;
      const g=m.get(k)||{key:k,cod:r.cod,forn:r.forn,comp:r.comp,tipo:tp,n:0,vdoc:0,liqs:[]};
      g.n++;g.vdoc+=r.vdoc;g.liqs.push(r.liq);m.set(k,g);
    }
  }
  return[...m.values()];
}
function estadoJust(){
  const ult=new Map();
  for(const e of D.just)ult.set(e.chave,e);
  const ativos=new Map();for(const[k,e]of ult)if(e.acao==='justificou')ativos.set(k,e);
  return ativos;
}
function alertasAtuais(){

  return{pend:todos.filter(a=>!j.has(a.key)).sort((a,b)=>a.forn.localeCompare(b.forn)||a.comp.localeCompare(b.comp)),just:todos.filter(a=>j.has(a.key)).map(a=>({...a,j:j.get(a.key)})),j};
}
function comportamento(g){
  const meses=Object.keys(g.meses).map(Number).sort((a,b)=>a-b);
  const nMesesGlobais=porComp(rowsEx()).map(c=>+c.comp.slice(5));
  if(!meses.length)return{t:'Sem dados',c:'cz'};
  const ult=nMesesGlobais[nMesesGlobais.length-1];
  const atual=g.meses[ult]||0;
  const ant=nMesesGlobais.filter(m=>m<ult).map(m=>g.meses[m]||0);
  if(!ant.length)return{t:'Sem histórico',c:'cz'};
  const media=ant.reduce((a,b)=>a+b,0)/ant.length;
  if(media===0&&atual>0)return{t:'Novo no ano',c:''};
  if(atual===0&&media>0)return{t:'Sem retenção no último mês',c:'at'};
  if(media===0)return{t:'—',c:'cz'};
  const v=(atual-media)/media;
  if(v>0.15)return{t:'▲ '+pct(v,0)+' vs. média',c:'at'};
  if(v<-0.15)return{t:'▼ '+pct(-v,0)+' vs. média',c:'at'};
  return{t:'● Estável',c:'ok'};
}
/* projeção da competência do mês atual → guia do mês seguinte */
function calcProj(){
  const h=hoje(),comp=h.slice(0,7),y=+h.slice(0,4),m=+h.slice(5,7);
  const atuais=D.rows.filter(r=>r.comp===comp);
  const ultLiq=D.rows.reduce((mx,r)=>r.dliq>mx?r.dliq:mx,'');
  const corte=ultLiq&&ultLiq<h?ultLiq:h;
  const duTot=diasUteisMes(y,m),duDec=diasUteisAte(y,m,corte);
  const frac=duTot?Math.min(1,duDec/duTot):0;
  const comps=[...new Set(D.rows.map(r=>r.comp))].filter(c=>c<comp).sort().slice(-3);
  const cods=new Map();
  D.rows.filter(r=>r.comp===comp||comps.includes(r.comp)).forEach(r=>cods.set(r.cod,r.forn));
  const linhas=[];
  for(const[cod,forn]of cods){
    const atual=sum(atuais.filter(r=>r.cod===cod),r=>r.inss);
    const media=comps.length?sum(comps,c=>sum(D.rows.filter(r=>r.comp===c&&r.cod===cod),r=>r.inss))/comps.length:0;
    const ritmo=frac>0?atual/frac:atual;
    let proj;
    if(frac>=1)proj=atual;
    else if(media>0)proj=atual+(1-frac)*media;
    else proj=frac>=0.2?ritmo:atual;
    linhas.push({cod,forn,atual,media,ritmo,proj});
  }
  linhas.sort((a,b)=>b.proj-a.proj);
  return{comp,corte,duTot,duDec,frac,comps,linhas,atual:sum(linhas,l=>l.atual),ritmo:sum(linhas,l=>l.ritmo),media:sum(linhas,l=>l.media),proj:sum(linhas,l=>l.proj),nLanc:atuais.length,venc:venc(comp),semHist:!comps.length};
}
function proximaGuia(){
  const h=hoje(),hc=h.slice(0,7);let y=+hc.slice(0,4),m=+hc.slice(5)-1;if(m<1){m=12;y--}
  let c=y+'-'+pad(m);if(venc(c).iso<h)c=hc;
  const rs=D.rows.filter(r=>r.comp===c);
  return{comp:c,v:venc(c),inss:sum(rs,r=>r.inss),n:rs.length};
}

/* ============ GRÁFICO SVG ============ */
function chartBarras(items,{h=230,legenda=true,w=null}={}){
  const W=w||Math.max(320,Math.min(1000,($('#conteudo').clientWidth||700)-40)),pl=46,pr=6,pt=22,pb=28,iw=W-pl-pr,ih=h-pt-pb;
  const mx=Math.max(1,...items.map(i=>i.val+(i.proj||0)));
  const passo=Math.pow(10,Math.floor(Math.log10(mx)));let teto=Math.ceil(mx/passo)*passo;if(teto/passo<2)teto=2*passo;
  const bw=iw/items.length,b=Math.min(bw*0.64,46);
  let s=`<svg viewBox="0 0 ${W} ${h}" class="w-full" role="img" aria-label="Gráfico de barras mensal de INSS retido">`;
  for(let t=0;t<=4;t++){const v=teto*t/4,y=pt+ih-ih*t/4;s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#CFDDEA" stroke-width="1"/><text x="${pl-6}" y="${y+3.5}" text-anchor="end" font-size="10" fill="#55666A">${abrev(v)}</text>`}
  s+=`<defs><pattern id="hach" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FBEAB5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F3C64F" stroke-width="3"/></pattern></defs>`;
  items.forEach((it,i)=>{
    const x=pl+bw*i+(bw-b)/2,hv=ih*it.val/teto,hp=ih*(it.proj||0)/teto,yv=pt+ih-hv;
    if(it.val>0)s+=`<rect x="${x}" y="${yv}" width="${b}" height="${hv}" rx="3" fill="${it.dest?'#1B6AA5':'#2584C6'}"><title>${esc(it.label)}: ${brl(it.val)}</title></rect>`;
    if(hp>0)s+=`<rect x="${x}" y="${yv-hp}" width="${b}" height="${hp}" rx="3" fill="url(#hach)" stroke="#F3C64F"><title>${esc(it.label)} · projeção do restante: ${brl(it.proj)}</title></rect>`;
    const tot=it.val+(it.proj||0);
    if(tot>0)s+=`<text x="${x+b/2}" y="${pt+ih-ih*tot/teto-4}" text-anchor="middle" font-size="10" font-weight="600" fill="#1B1F24">${abrev(tot)}</text>`;
    s+=`<text x="${x+b/2}" y="${h-10}" text-anchor="middle" font-size="10.5" fill="#55666A">${esc(it.label)}</text>`;
  });
  if(legenda&&items.some(i=>i.proj))s+=`<rect x="${W-180}" y="2" width="10" height="10" fill="url(#hach)" stroke="#F3C64F"/><text x="${W-166}" y="11" font-size="10.5" fill="#55666A">Projeção do restante do mês</text>`;
  return s+'</svg>';
}

function vAlertas(al){
  const sub=UI.subAl||'pend';

/* ============ IMPORTAÇÃO DA PLANILHA (EFD Reinf) ============ */
function lerArquivo(buf){
  if(!window.XLSX)throw{message:'A biblioteca de leitura de Excel (SheetJS) não carregou. Verifique a conexão/bloqueios de rede para cdn.jsdelivr.net e recarregue com Ctrl+F5.'};
  const wb=XLSX.read(buf,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  const hi=aoa.findIndex(l=>l&&l.some(c=>semAcento(c)==='cod_fornecedor'));
  if(hi<0)throw{message:'Não encontrei a coluna "cod_fornecedor". Este não parece ser o arquivo SemAprop_INSS_EFD_Reinf.'};
  const cols={};aoa[hi].forEach((c,i)=>{if(c!=null)cols[semAcento(c)]=i});
  for(const k of ['fornecedor','mescompetencia','exerciciocompetencia','basedecalculo','inss'])if(!(k in cols))throw{message:'Coluna obrigatória ausente no arquivo: '+k};
  const g=(l,k)=>cols[k]==null?null:l[cols[k]];
  const out=[],vistos=new Map();
  for(const l of aoa.slice(hi+1)){
    if(!l||g(l,'cod_fornecedor')==null||g(l,'cod_fornecedor')==='')continue;
    const r={cod:String(g(l,'cod_fornecedor')).trim(),forn:String(g(l,'fornecedor')||'').trim(),doc:String(g(l,'cpf_cnpj')||'').trim(),tipo:String(g(l,'tipofornecedor')||''),ug:g(l,'unidadegestora')||'',emp:g(l,'empenho')??'',vin:g(l,'vinculo')||'',liq:g(l,'liquidacao')??'',dliq:toISO(g(l,'dataliquidacao')),mes:num(g(l,'mescompetencia')),ano:num(g(l,'exerciciocompetencia')),tdoc:g(l,'tipodocumentoliquidacao')||'',ndoc:g(l,'numerodocumento')??'',serie:g(l,'serie')||'',demi:toISO(g(l,'dataemissao')),vdoc:r2(num(g(l,'valordocumento'))),base:r2(num(g(l,'basedecalculo'))),inss:r2(num(g(l,'inss'))),tserv:g(l,'tiposervico')??''};
    r.mesS=r.mes;r.anoS=r.ano;
    if(!r.mes||!r.ano)continue;
    aplicarComp(r);
    const k0=[r.cod,r.emp,r.liq,r.ndoc,r.serie].join('|');const n=(vistos.get(k0)||0)+1;vistos.set(k0,n);
    r.chave=n>1?k0+'#'+n:k0;
    out.push(r);
  }
  if(!out.length)throw{message:'Nenhuma linha de dados encontrada no arquivo.'};
  return out;
}
const linhaDados=(r,em,por)=>[r.chave,r.cod,r.forn,r.doc,r.tipo,r.ug,r.emp,r.vin,r.liq,r.dliq,r.mesS,r.anoS,r.tdoc,r.ndoc,r.serie,r.demi,r.vdoc,r.base,r.inss,r.tserv,em,por];
async function gravarDados(rows,em){
  const L=rows.map(r=>linhaDados(r,r.impEm||em,r.impPor||SESSAO.u));
  const bloco=2000;
  for(let i=0;i<L.length;i+=bloco){
    const a=i+2,fatia=L.slice(i,i+bloco);
    await SHEETS('/values/'+rng(ABA.dados,'A'+a+':V'+(a+fatia.length-1))+'?valueInputOption=RAW',{method:'PUT',body:JSON.stringify({values:fatia})});
  }
  /* só depois de gravar, limpa as linhas que sobraram */
  await SHEETS('/values/'+rng(ABA.dados,'A'+(L.length+2)+':V')+':clear',{method:'POST',body:'{}'});
}
async function importar(file){
  let novas;
  try{novas=lerArquivo(await file.arrayBuffer())}catch(e){await modal({titulo:'Não foi possível ler o arquivo',texto:e.message||String(e),ok:'Entendi',cancelar:'Fechar'});return}
  const exist=new Map(D.rows.map(r=>[r.chave,r]));
  const nNovas=novas.filter(r=>!exist.has(r.chave)).length,nAtu=novas.length-nNovas;
  const comps=[...new Set(novas.map(r=>r.comp))].sort();
  const dmin=novas.reduce((m,r)=>r.dliq&&(!m||r.dliq<m)?r.dliq:m,''),dmax=novas.reduce((m,r)=>r.dliq>m?r.dliq:m,'');
  const semBase=novas.filter(r=>r.base===0&&r.vdoc>0).length;
  const resumo=`<div><b>${esc(file.name)}</b></div><ul class="list-disc pl-5 mt-1">
    <li>${novas.length} lançamentos · ${new Set(novas.map(r=>r.cod)).size} fornecedores</li>
    <li>Mês(es) da retenção (${CRIT[UI.criterio]}): ${comps.map(compLabel).join(', ')} · liquidações de ${fdata(dmin)} a ${fdata(dmax)}</li>
    <li>Base de cálculo: <b>${brl(sum(novas,r=>r.base))}</b> · INSS retido: <b>${brl(sum(novas,r=>r.inss))}</b></li>
    <li>${nNovas} novo(s) · ${nAtu} já existente(s) na planilha</li>
    ${semBase?`<li style="color:var(--alerta)">${semBase} lançamento(s) com base de cálculo zerada (serão sinalizados)</li>`:''}</ul>`;
  const modo=await modal({titulo:'Importar para o painel',texto:'Confirme que a consulta SemAprop_INSS_EFD_Reinf foi gerada pela DATA DA LIQUIDAÇÃO — o mês da retenção (e a guia) é definido por ela. Os dados serão gravados na planilha do Google. Escolha como tratar o que já existe:',resumo,campo:{rotulo:'Modo de importação',tipo:'radio',valor:'mesclar',opcoes:[{v:'mesclar',t:'Mesclar (recomendado)',d:'Atualiza lançamentos já existentes e acrescenta os novos. Nada é apagado.'},{v:'periodo',t:'Substituir o período do arquivo',d:`Remove os lançamentos já gravados com data de liquidação entre ${fdata(dmin)} e ${fdata(dmax)} e coloca os do arquivo. Use quando o sistema cancelou/estornou lançamentos.`}]},ok:'Importar'});
  if(!modo)return;
  $('#carregando').textContent='Gravando na planilha…';$('#carregando').hidden=false;
  try{
    const em=agoraISO();let base=D.rows;
    if(modo==='periodo')base=base.filter(r=>!(r.dliq&&r.dliq>=dmin&&r.dliq<=dmax));
    const mapa=new Map(base.map(r=>[r.chave,r]));novas.forEach(r=>{r.impEm=em;r.impPor=SESSAO.u;mapa.set(r.chave,r)});
    const final=[...mapa.values()];
    const removidas=modo==='periodo'?D.rows.length-base.length:0;
    await hist('Importou planilha',file.name+' | modo '+modo+' | competências '+comps.join(',')+' | novos '+nNovas+' | atualizados '+nAtu+(removidas?' | removidos '+removidas:''),novas.length,r2(sum(novas,r=>r.inss)));
    await gravarDados(final,em);
    const cfg={ultima_importacao:em,arquivo:file.name,importado_por:SESSAO.u,linhas_arquivo:novas.length,total_linhas:final.length};
    await SHEETS('/values/'+rng(ABA.cfg,'A2:B'+(1+Object.keys(cfg).length))+'?valueInputOption=RAW',{method:'PUT',body:JSON.stringify({values:Object.entries(cfg)})});
    await carregar(true);toast('Importação concluída: '+novas.length+' lançamentos.');
  }catch(e){mostrarErro(e,'Falha ao gravar na planilha')}
}

/* ============ FLUXO PRINCIPAL ============ */
async function carregar(silencioso){
  $('#erro').hidden=true;
  if(!silencioso){$('#conteudo').hidden=true}
  $('#carregando').textContent='Carregando dados da planilha…';$('#carregando').hidden=false;
  try{
    await lerTudo();resolverAcesso();
    if(!UI.tela||!ACESSO.telas.some(t=>t.id===UI.tela))UI.tela=ACESSO.telas[0]?ACESSO.telas[0].id:null;
    $('#carregando').hidden=true;$('#conteudo').hidden=false;renderTela();
  }catch(e){mostrarErro(e,'Não foi possível ler a planilha')}
}
async function entrar(){
  const b=$('#btn-entrar');b.disabled=true;$('#login-msg').textContent='Abrindo login do Google…';
  try{
    await pedirToken('');
    const r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+TOKEN}});
    const u=await r.json();
    SESSAO={u:String(u.email||'').toLowerCase(),nome:u.name||u.email||'',ativo:Date.now()};
    $('#login').hidden=true;$('#app').hidden=false;
    ['#usr-nome','#usr-nome-m'].forEach(s=>$(s).textContent=SESSAO.nome);['#usr-email','#usr-email-m'].forEach(s=>$(s).textContent=SESSAO.u);
    await carregar();
  }catch(e){b.disabled=false;$('#login-msg').textContent=(e.message||'Falha no login.')+(dicaErro(e)?' '+dicaErro(e):'')}
}
$('#btn-entrar').onclick=entrar;
$('#btn-sair').onclick=sair;
$('#btn-menu').onclick=()=>{$('#nav').classList.toggle('-translate-x-full');$('#nav-bg').classList.toggle('hidden')};
$('#nav-bg').onclick=()=>{$('#nav').classList.add('-translate-x-full');$('#nav-bg').classList.add('hidden')};
$('#menu').onclick=e=>{const a=e.target.closest('[data-tela]');if(!a)return;UI.tela=a.dataset.tela;$('#nav').classList.add('-translate-x-full');$('#nav-bg').classList.add('hidden');renderTela()};
let _rz;addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(()=>{if(SESSAO&&UI.tela==='inss'&&!$('#conteudo').hidden&&!document.querySelector('dialog[open]')&&D.rows.length)renderInss()},250)});
$('#arq').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importar(f)};
function falhaGlobal(msg){
  msg=String(msg||'');
  if(/listener indicated an asynchronous response|Cross-Origin-Opener|ResizeObserver/i.test(msg))return; // ruído de extensões/Google
  console.error('Falha:',msg);
  if(SESSAO)toast('Erro: '+msg.slice(0,220),9000);
}
addEventListener('error',e=>falhaGlobal(e.message));
addEventListener('unhandledrejection',e=>falhaGlobal(e.reason&&(e.reason.message||e.reason)));
if(window.__gsi)iniciarGoogle();
</script>
